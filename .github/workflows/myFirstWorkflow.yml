name: my-first-workflow

# To get a trigger on every push
on:
  push:
    branches:
     - main
  pull_request:
      - main
      - dev
  pull_request: 
    branches:
     - main

jobs: 
  unit-tests:
    name: Running Unit Tests
    runs-on: ubuntu-latest
    steps:
     - name: Checkout Code
       uses: actions/checkout@v5
    name: Running Unit Tests
    runs-on: ubuntu-latest
    steps:
     - name: Checkout Code
       uses: actions/checkout@v5
     - name: Setup Python
       uses: actions/setup-python@v5
       uses: actions/setup-python@v5
       with:
         python-version: '3.10'
         python-version: '3.10'
     - name: Install Dependencies
       run: |
         python -m pip install --upgrade pip
         pip install -r requirements.txt
         python -m pip install --upgrade pip
         pip install -r requirements.txt
     - name: Run Unit Tests
       run: |
         mkdir reports/
         pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v 
     - name: Upload Code Coverage Report
       uses: actions/upload-artifact@v3
       with:
         name: unit-test-results
         path: reports/
         
