

name: my-first-workflow
# To get a trigger on every push 
on: 
  #push:
  #schedule:
    - cron: "5 * * * *"
  #workflow_dispatch: 
  push: 
  

jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: 
          pwd
          ls -ltr
          
      - name: Step-2
        run: actions/checkout@v5.0.0
      - name: Step-3
        run: 
          echo `pwd` >> myartifact.txt
          ls -ltr 
          hostname
      - name: Upload single file
        uses: actions/upload-artifact@v5.0.0
        with: 
          name: single_file
          path: ./myartifact.txt
