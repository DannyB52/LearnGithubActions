name: my-first-workflow
# To get a trigger on every push 
on: 
  push: 

jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          
      - name: Step-2
        uses: actions/checkout@v5.0.0
      - name: Step-3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: Upload single file
        uses: actions/upload-artifact@v5.0.0
        with:
          name: single_file
          path: ./myartifact.txt
      - name: Upload from dir
        uses: actions/upload-artifact@v5.0.0
        with: 
          name: directory_artifact
          path: artifacts/
      - name: Upload from multiple paths
        uses: actions/upload-artifact@v5.0.0
        with: 
          name: multiple_paths
          path: |
            ./myartifact.txt
            artifacts/
      - name: Upload from multiple paths with exclusions
        uses: actions/upload-artifact@v5.0.0
        with: 
          name: multiple_paths_with_exclusions
          path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt
  job2:
    name: Job2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v5.0.0
        with:
          name: single_file
      - name: Checking current directory post download
        run: |
          pwd
          ls -ltr
  job3:
    name: Job3
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download directory
        uses: actions/download-artifact@v5.0.0
        with:
          name: directory_artifact
      - name: Checking current directory post download
        run: |
          pwd
          ls -ltr

  job4:
    name: Job5
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Creating custom folder for download
        run: |
          mkdir -p single_file
          mkdir -p download_directory
          
      - name: Checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v5.0.0
        with:
          name: single_file
          path: single_file
      - name: Download directory
        uses: actions/download-artifact@v5.0.0
        with:
          name: directory_artifact
          path: download_directory
      - name: Checking current directory post download
        run: |
          echo "Checking single file directory "
          pwd
          ls -ltr single_file
          echo "Checking directory artifact "
          ls -ltr
