name: my-second-workflow


# To get a trigger on every push
on:
  push:
    branches:
     - main
     - dev
  pull_request:
    branches:
      - main
      - dev

jobs: 
  unit-tests:
    name: Running Unit Tests
    runs-on: ubuntu-latest
    steps:
     - name: Checkout Code
       uses: actions/checkout@v5
     - name: Setup Python
       uses: actions/setup-python@v5
       with:
         python-version: '3.10'
     - name: Install Dependencies
       run: |
         python -m pip install --upgrade pip
         pip install -r requirements.txt
     - name: Run Unit Tests
       run: |
         mkdir reports/
         pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v 
     - name: Upload Code Coverage Report
       uses: actions/upload-artifact@v4
       with:
         name: unit-test-results
         path: reports/
         
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload the results of the CodeQL analysis
    strategy:
      matrix:
        language: [python]
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "security"
      - name: Upload CodeQL Results
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: reports/
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   #34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args:
            -Dsonar.projectKey=DannyB52_LearnGithubActions
            -Dsonar.sources=.
            #-Dsonar.analysis.mode=issues
