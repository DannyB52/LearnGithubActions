name: my-second-workflow


# To get a trigger on every push
on:
  push:
    branches:
     - main
     - dev
  pull_request:
    branches:
      - main
      - dev
permissions:
    actions: read
    contents: read
    security-events: write # Required to upload the results of the CodeQL analysis

jobs: 
  ci-pipeline-job:
    #DannyB52/reusable-workflow/blob/main/.github/workflows/ci-pipeline.yml
    uses: DannyB52/reusable-workflow/.github/workflows/ci-pipeline.yml@main
    secrets:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

